name: Offline tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install headless Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libopengl0 libxkbcommon-x11-0
      - name: Install test dependencies
        run: python -m pip install -e '.[gemini,voice,web,schedule,calendar,desktop,dev]'
      - name: Run tests
        run: python -m pytest -q
      - name: Check compilation
        run: python -m compileall -q src tests
      - name: Run Ruff
        run: python -m ruff check .
